// ==================== 状态 ====================
let answers = {};
let sec = 0, timerInt = null;
let currentLevel = 'ket';

function getQuiz() { return QUIZZES[currentLevel]; }
function getTotal() {
  let t = 0;
  getQuiz().parts.forEach(p => { t += p.questions.length + (p.titleQ ? 1 : 0); });
  return t;
}

function startTest(level) {
  currentLevel = level;
  answers = {};
  document.getElementById('stepLevel').style.display = 'none';
  document.getElementById('stepQuiz').style.display = 'block';
  document.getElementById('stepResult').style.display = 'none';
  window.scrollTo(0,0);
  renderQuiz();
  sec = 0;
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    sec++;
    const m = String(Math.floor(sec/60)).padStart(2,'0');
    const s = String(sec%60).padStart(2,'0');
    document.getElementById('timer').textContent = '⏱ '+m+':'+s;
  }, 1000);
}

function renderQuiz() {
  const quiz = getQuiz();
  const total = getTotal();
  document.getElementById('progText').textContent = '0/'+total;
  document.getElementById('progFill').style.width = '0%';
  const body = document.getElementById('quizBody');
  let html = '', num = 0;
  quiz.parts.forEach((part, pi) => {
    html += `<div class="part-block"><div class="part-title">${part.title}</div><div class="part-instr">${part.instr}</div>`;
    if (part.story) html += `<div class="story-box">${part.story}</div>`;
    if (part.words) html += `<div class="story-box">词库：${part.words.map(w=>`<b>${w}</b>`).join(' · ')}</div>`;
    if (part.opts_pool) html += `<div class="story-box" style="font-size:.8rem">${part.opts_pool.join('<br>')}</div>`;
    part.questions.forEach((q, qi) => {
      const id = `p${pi}_q${qi}`;
      num++;
      html += `<div class="q-item"><div class="q-text"><span class="num">${num}</span>${q.q}</div>`;
      if (part.type === 'choose') {
        html += `<div class="q-opts">${part.words.map(w=>`<label class="q-opt" data-id="${id}" data-val="${w}"><input type="radio" name="${id}"><span class="dot">✓</span>${w}</label>`).join('')}</div>`;
      } else if (part.type === 'mc') {
        html += `<div class="q-opts">${q.opts.map((o,oi)=>`<label class="q-opt" data-id="${id}" data-val="${oi}"><input type="radio" name="${id}"><span class="dot">✓</span>${o}</label>`).join('')}</div>`;
      } else {
        html += `<input class="q-input" data-id="${id}" placeholder="在此输入答案" autocomplete="off">`;
      }
      html += `</div>`;
    });
    if (part.titleQ) {
      num++;
      const id = `p${pi}_title`;
      html += `<div class="q-item"><div class="q-text"><span class="num">${num}</span>${part.titleQ.q}</div>`;
      html += `<div class="q-opts">${part.titleQ.opts.map((o,oi)=>`<label class="q-opt" data-id="${id}" data-val="${oi}"><input type="radio" name="${id}"><span class="dot">✓</span>${o}</label>`).join('')}</div></div>`;
    }
    html += `</div>`;
  });
  body.innerHTML = html;

  body.querySelectorAll('.q-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      const id = opt.dataset.id;
      opt.parentElement.querySelectorAll('.q-opt').forEach(s => s.classList.remove('sel'));
      opt.classList.add('sel');
      answers[id] = opt.dataset.val;
      updateProgress();
    });
  });
  body.querySelectorAll('.q-input').forEach(inp => {
    inp.addEventListener('input', () => {
      answers[inp.dataset.id] = inp.value.trim();
      updateProgress();
    });
  });
}

function updateProgress() {
  const done = Object.keys(answers).length;
  const total = getTotal();
  document.getElementById('progFill').style.width = (done/total*100) + '%';
  document.getElementById('progText').textContent = done + '/' + total;
}

function submitQuiz() {
  const quiz = getQuiz();
  const total = getTotal();
  const done = Object.keys(answers).length;
  if (done < total && !confirm(`还有 ${total-done} 题未作答，确定提交吗？`)) return;
  clearInterval(timerInt);

  let score = 0;
  const partScores = [];
  quiz.parts.forEach((part, pi) => {
    let ps = 0;
    part.questions.forEach((q, qi) => {
      const id = `p${pi}_q${qi}`;
      const ans = answers[id];
      if (part.type === 'choose' || part.type === 'mc') {
        if (String(ans) === String(q.a)) { score++; ps++; }
      } else {
        if (ans && q.key.some(k => ans.toLowerCase().includes(k.toLowerCase()))) { score++; ps++; }
      }
    });
    if (part.titleQ && String(answers[`p${pi}_title`]) === String(part.titleQ.a)) { score++; ps++; }
    partScores.push({name: part.title.replace(/ ·.*/,'').replace('Part ','P'), score: ps, total: part.questions.length + (part.titleQ?1:0)});
  });

  showResult(score, total, partScores);
}

function showResult(score, total, partScores) {
  document.getElementById('stepQuiz').style.display = 'none';
  document.getElementById('stepResult').style.display = 'block';
  window.scrollTo(0,0);

  const quiz = getQuiz();
  document.getElementById('rScore').textContent = score;
  document.getElementById('rTotal').textContent = quiz.totalLabel;
  const lv = document.getElementById('rLevel');
  const adv = document.getElementById('rAdvice');
  const pct = score / total;

  const adviceMap = {
    ket: [
      {min:.8, cls:'lv-a', lvl:'建议学习：KET 精品班（对接 KB4）', msg:'你的英语基础非常扎实！已具备进入 <b>KET 精品班（对接 Kids Box 4 教材）</b>的水平。建议系统学习剑桥 KET 考试内容，为备考打下坚实基础。'},
      {min:.7, cls:'lv-b', lvl:'建议学习：KET 精品班（对接 KB5/新生）', msg:'你的英语基础良好，适合进入 <b>KET 精品班（对接 Kids Box 5 教材或新生班）</b>。建议从基础巩固开始，稳步提升词汇和阅读能力。'},
      {min:0, cls:'lv-c', lvl:'建议：先巩固基础再测试', msg:'本次得分偏低，建议先通过 APP 的「单词闯关」和「分级阅读」打好词汇基础，1-2个月后再来测试。'}
    ],
    pet: [
      {min:.8, cls:'lv-a', lvl:'建议学习：PET 提升班', msg:'你的英语水平已达到 <b>KET 优秀</b>水平，建议进入 <b>PET 提升班</b>，直接备考剑桥 PET 考试。'},
      {min:.67, cls:'lv-b', lvl:'建议学习：PET 精品班', msg:'你的英语水平达到 KET 合格，适合进入 <b>PET 精品班</b>系统提升，逐步向 PET 考试迈进。'},
      {min:0, cls:'lv-c', lvl:'建议：先夯实 KET 基础', msg:'本次得分偏低，建议先完成 KET 级别的系统学习，打好基础后再挑战 PET。'}
    ],
    fce: [
      {min:.75, cls:'lv-a', lvl:'建议学习：FCE 提升班', msg:'你的英语水平已达到 <b>PET 优秀</b>水平，建议进入 <b>FCE 提升班</b>，挑战剑桥 FCE 考试。'},
      {min:.6, cls:'lv-b', lvl:'建议学习：FCE 精品班', msg:'你的英语水平达到 PET 合格，适合进入 <b>FCE 精品班</b>系统提升。'},
      {min:0, cls:'lv-c', lvl:'建议：先夯实 PET 基础', msg:'本次得分偏低，建议先完成 PET 级别的系统学习，再挑战 FCE。'}
    ]
  };

  const tier = adviceMap[currentLevel].find(t => pct >= t.min);
  lv.textContent = tier.lvl;
  lv.className = 'result-level ' + tier.cls;
  adv.innerHTML = `<h4>🎯 测试结果分析</h4><p>${tier.msg}<br>点击下方按钮查看对应课程套餐，或下载 APP 开始体验。</p>`;

  document.getElementById('rParts').innerHTML = partScores.map(p =>
    `<div class="ps-item"><div class="ps-name">${p.name}</div><div class="ps-val">${p.score}/${p.total}</div></div>`
  ).join('');

  adv.innerHTML += `<p style="margin-top:10px;font-size:.75rem;color:#aaa">注：本测试为剑桥英语官方样卷客观题部分，写作部分需人工测评，可联系客服预约。</p>`;
}
</script>
