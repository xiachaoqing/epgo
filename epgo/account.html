<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/x-icon" href="/epgo/favicon.ico">
<title>英语陪跑GO · 登录信息</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;font-family:"PingFang SC","Microsoft YaHei",Arial;color:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#fff;width:100%;max-width:430px;border-radius:20px;padding:30px 24px;box-shadow:0 8px 36px rgba(0,0,0,.08)}h1{text-align:center;font-size:1.35rem;margin:0 0 8px}.sub{text-align:center;color:#777;font-size:.9rem;line-height:1.7}.box{margin-top:22px;background:#f0f9ff;border-radius:12px;padding:16px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #dceef8}.row:last-child{border:0}.label{color:#777}.value{font-weight:700}.btn{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:13px;margin-top:18px;background:#4E97D9;color:#fff;font-weight:700}.hint{margin-top:16px;color:#999;font-size:.8rem;line-height:1.7;text-align:center}
</style></head>
<body><main class="card"><h1 id="title">正在读取登录信息</h1><p class="sub" id="desc">请稍候…</p><div id="box"></div><div id="actions"></div></main>
<script>
const API='https://wechat.xiachaoqing.com';
const order=new URLSearchParams(location.search).get('order')||sessionStorage.getItem('jzt_order_no')||sessionStorage.getItem('jzt_order')||'';
const openid=sessionStorage.getItem('jzt_openid')||'';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){document.getElementById('actions').innerHTML='<a class="btn" href="/epgo/#follow">关注公众号 · 回复“查账号”</a><p class="hint">账号由我们为您开通。请勿把登录密码发给他人。</p>'}
async function load(){
 if(!order||!openid){document.getElementById('title').textContent='需要微信授权';document.getElementById('desc').textContent='请从英语陪跑GO支付结果页进入，或在公众号回复“查账号”。';render();return}
 try{const r=await fetch(`${API}/api/jzt/order/status?order_no=${encodeURIComponent(order)}&openid=${encodeURIComponent(openid)}`);const d=await r.json();
  if(d.status==='paid'&&d.account){document.getElementById('title').textContent='登录信息';document.getElementById('desc').textContent='请使用以下信息登录英语陪跑GO App';document.getElementById('box').innerHTML=`<div class="box"><div class="row"><span class="label">账号</span><span class="value">${esc(d.account)}</span></div><div class="row"><span class="label">密码</span><span class="value">${esc(d.password||'请在公众号回复「查账号」获取')}</span></div><div class="row"><span class="label">套餐</span><span class="value">${esc(d.plan)}</span></div><div class="row"><span class="label">有效期至</span><span class="value">${esc((d.expire_at||'').slice(0,10))}</span></div></div>`;render();}
  else {document.getElementById('title').textContent=d.status==='activating'?'账号正在开通':'暂未查到订单';document.getElementById('desc').textContent=d.message||'请稍后再试';render()}
 }catch(e){document.getElementById('title').textContent='暂时无法读取';document.getElementById('desc').textContent='请稍后刷新，或在公众号回复“查账号”';render()}
}
load();
</script></body></html>
