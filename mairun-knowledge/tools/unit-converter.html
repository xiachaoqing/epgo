<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="工程常用单位换算工具，支持温度、功率、压力和能耗的基础换算。"><link rel="canonical" href="https://tech.mairunkeji.com/tools/unit-converter.html"><link rel="stylesheet" href="../assets/site.css"><title>工程单位换算工具｜麦润知识库</title></head><body class="article-page"><header class="header"><div class="wrap"><a class="brand" href="../"><span class="brand-mark">MR</span><span><span class="brand-title">麦润工业电气知识库</span><span class="brand-subtitle">工程单位换算</span></span></a><nav class="nav"><a href="../tools/">工程工具</a><a href="../#articles">最新文章</a></nav></div></header><main><div class="breadcrumbs"><a href="../">首页</a> / <a href="./">工程工具</a> / 单位换算</div><h1>工程单位换算工具</h1><div class="article-body"><p>选择换算类型并输入数值，结果只在浏览器本地计算。</p><div class="card" style="margin:24px 0"><label>类型 <select id="kind"><option value="kwhp">功率：kW → hp</option><option value="cft">温度：°C → °F</option><option value="barpsi">压力：bar → psi</option><option value="kwhmj">能耗：kWh → MJ</option></select></label><label style="display:block;margin-top:12px">数值 <input id="value" type="number" step="0.01" value="1" style="padding:10px;width:140px"></label><button class="button" id="convert" type="button" style="margin-top:16px">换算</button><p id="output" class="callout" aria-live="polite">请输入数值后换算。</p></div><h2>换算说明</h2><p>不同厂家、标准和设备资料可能采用不同单位体系。采购和验收时应以设备铭牌、技术协议和合同约定为准。</p></div></main><footer class="footer"><div class="wrap"><span>© 麦润工业电气知识库</span><span><a href="../privacy.html">隐私政策</a> · <a href="../contact.html">技术咨询</a></span></div></footer><script>document.querySelector('#convert').addEventListener('click',function(){const v=Number(document.querySelector('#value').value),k=document.querySelector('#kind').value;const map={kwhp:[v*1.34102,'hp'],cft:[v*9/5+32,'°F'],barpsi:[v*14.5038,'psi'],kwhmj:[v*3.6,'MJ']};const r=map[k];document.querySelector('#output').textContent='换算结果：'+r[0].toFixed(4)+' '+r[1]+'。';});</script></body></html>
