<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="配电柜日常巡检表模板，包含环境、柜体、连接点、温湿度和异常记录。"><link rel="canonical" href="https://tech.mairunkeji.com/tools/maintenance-checklist.html"><link rel="stylesheet" href="../assets/site.css"><title>配电柜巡检表｜麦润知识库</title><style>@media print{.header,.footer,.no-print{display:none!important}.article-page main{padding:10px 0}.checklist input{border:0}}</style></head><body class="article-page"><header class="header"><div class="wrap"><a class="brand" href="../"><span class="brand-mark">MR</span><span><span class="brand-title">麦润工业电气知识库</span><span class="brand-subtitle">配电柜巡检表</span></span></a><nav class="nav"><a href="../tools/">工程工具</a><a href="../#articles">最新文章</a></nav></div></header><main><div class="breadcrumbs"><a href="../">首页</a> / <a href="./">工程工具</a> / 配电柜巡检表</div><h1>配电柜日常巡检表</h1><div class="article-body"><p>填写设备和日期后可直接打印。表格是记录模板，不替代企业自己的点检制度、风险分级和安全许可。</p><div class="card checklist"><label>设备/区域：<input id="device" type="text" placeholder="例如：1号低压柜" style="padding:8px"></label><label style="margin-left:12px">日期：<input id="date" type="date" style="padding:8px"></label><table><thead><tr><th>检查项</th><th>正常</th><th>异常说明</th></tr></thead><tbody><tr><td>柜门、锁具和指示标识</td><td><input type="checkbox"></td><td><input type="text"></td></tr><tr><td>异响、异味和局部发热</td><td><input type="checkbox"></td><td><input type="text"></td></tr><tr><td>温度、湿度和凝露情况</td><td><input type="checkbox"></td><td><input type="text"></td></tr><tr><td>无线测温或报警记录</td><td><input type="checkbox"></td><td><input type="text"></td></tr><tr><td>仪表显示和通信状态</td><td><input type="checkbox"></td><td><input type="text"></td></tr></tbody></table><button class="button no-print" type="button" onclick="window.print()">打印巡检表</button></div><h2>记录建议</h2><p>发现发热、放电声、焦糊味、保护动作或绝缘异常时，应按企业安全规程停止相关操作并通知专业人员，不要为了填写“正常”而跳过异常记录。</p></div></main><footer class="footer"><div class="wrap"><span>
